name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
      - run: make check
      - name: Install device-tree tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils-aarch64-linux-gnu=2.42-4ubuntu2.10 \
            device-tree-compiler=1.7.0-2build1 \
            qemu-user-static=1:8.2.2+ds-0ubuntu1.18
      - name: Inspect and reject the writable OSMC ramdisk
        run: make inspect-boot
      - name: Rebuild and verify the guarded Vero boot component
        run: make boot-probe
