name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check
      - name: Install device-tree tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            qemu-user-static
      - name: Inspect and reject the writable OSMC ramdisk
        run: make inspect-boot
      - name: Rebuild and verify the guarded Vero boot component
        run: make boot-probe
